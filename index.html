<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<title>O Infundíbulo de Mirango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180" aria-label="O Infundíbulo de Mirango — jogo"></canvas>
</div>

<div id="rotate">Gire o aparelho para jogar na horizontal ↻</div>
<div id="touch" aria-hidden="true">
  <div class="pad">
    <button data-act="up" class="tb up">▲</button>
    <button data-act="left" class="tb left">◀</button>
    <button data-act="right" class="tb right">▶</button>
    <button data-act="down" class="tb down">▼</button>
  </div>
  <div class="btns">
    <button data-act="b" class="tb bx">X</button>
    <button data-act="a" class="tb be">E</button>
    <button data-act="dash" class="tb bd">⇢</button>
    <button data-act="jump" class="tb bj">PULO</button>
  </div>
  <button data-act="start" class="tb pause">II</button>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/title.js"></script>
<script src="js/ch1.js"></script>
<script src="js/ch2.js"></script>
<script src="js/ch3.js"></script>
<script src="js/ch4.js"></script>
<script src="js/ch5.js"></script>
<script src="js/main.js"></script>
</body>
</html>
