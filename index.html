<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<title>O Ciclo de Mirango</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game" width="320" height="180" aria-label="O Ciclo de Mirango — jogo"></canvas>
</div>

<div id="rotate">Dica: gire o aparelho para uma tela maior ↻</div>
<div id="touch" aria-hidden="true">
  <div class="pad">
    <button data-act="up" class="tb dp up" aria-label="Cima"><svg viewBox="0 0 24 24" width="26" height="26" style="transform:rotate(0deg)"><path d="M12 4 L21 15 H15 V20 H9 V15 H3 Z" fill="currentColor"/></svg></button>
    <button data-act="left" class="tb dp left" aria-label="Esquerda"><svg viewBox="0 0 24 24" width="26" height="26" style="transform:rotate(-90deg)"><path d="M12 4 L21 15 H15 V20 H9 V15 H3 Z" fill="currentColor"/></svg></button>
    <button data-act="right" class="tb dp right" aria-label="Direita"><svg viewBox="0 0 24 24" width="26" height="26" style="transform:rotate(90deg)"><path d="M12 4 L21 15 H15 V20 H9 V15 H3 Z" fill="currentColor"/></svg></button>
    <button data-act="down" class="tb dp down" aria-label="Baixo"><svg viewBox="0 0 24 24" width="26" height="26" style="transform:rotate(180deg)"><path d="M12 4 L21 15 H15 V20 H9 V15 H3 Z" fill="currentColor"/></svg></button>
  </div>
  <div class="btns">
    <button data-act="dash" class="tb xb by"><b>Y</b><small>ESQUIVA</small></button>
    <button data-act="a" class="tb xb bx"><b>X</b><small>AÇÃO</small></button>
    <button data-act="b" class="tb xb bb"><b>B</b><small>GRITO</small></button>
    <button data-act="jump" class="tb xb ba"><b>A</b><small>PULO</small></button>
  </div>
  <button data-act="start" class="tb pause"><b>II</b>MENU</button>
</div>

<script src="js/core.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/ui.js"></script>
<script src="js/title.js"></script>
<script src="js/ch1.js"></script>
<script src="js/ch2.js"></script>
<script src="js/ch3.js"></script>
<script src="js/ch4.js"></script>
<script src="js/ch5.js"></script>
<script src="js/main.js"></script>
</body>
</html>
